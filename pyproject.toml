[project]
name = "lado-dashboard"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "kimchobo", email = "router128@hanmail.net" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.4",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
